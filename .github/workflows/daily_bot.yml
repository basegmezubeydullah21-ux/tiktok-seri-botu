name: TikTok Gunluk Seri Botu

on:
  schedule:
    # Her gün Türkiye saatiyle 15:00'te (UTC 12:00) çalışır
    - cron: '0 12 * * *'
  workflow_dispatch: # Elle manuel başlatma butonu ekler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Depodan Çek
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Playwright ve Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Botu Çalıştır
        run: python bot.py
