<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Seri Botu Otomasyonu</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #fe2c55; }
        label { font-size: 14px; color: #bbb; display: block; margin-top: 12px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        input[type="file"] { margin-top: 8px; color: #bbb; }
        button { width: 100%; padding: 12px; background: #fe2c55; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #status { font-weight: bold; margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>TikTok Seri Otomasyonu 🚀</h2>
        
        <label>Senin Kullanıcı Adın:</label>
        <input type="text" id="user1" placeholder="ör: ahmet">
        
        <label>Arkadaşının Kullanıcı Adı:</label>
        <input type="text" id="target1" placeholder="ör: mehmet">
        
        <label>Senin cookies.txt Dosyanı Seç:</label>
        <input type="file" id="file1" accept=".txt">

        <hr style="border-color: #333; margin-top: 20px;">

        <label>GitHub Token (ghp_...):</label>
        <input type="password" id="ghToken" placeholder="ghp_ ile başlayan tokeniniz">

        <button onclick="uploadAndSend()">Dosyayı Yükle ve Başlat</button>
        <p id="status"></p>
    </div>

    <script>
        const GH_OWNER = "basegmezubeydullah21-ux";
        const GH_REPO = "tiktok-seri-botu";

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        async function uploadAndSend() {
            const status = document.getElementById('status');
            const user1 = document.getElementById('user1').value.trim();
            const target1 = document.getElementById('target1').value.trim();
            const fileInput1 = document.getElementById('file1');
            const token = document.getElementById('ghToken').value.trim();

            if(!user1 || !target1 || fileInput1.files.length === 0 || !token) {
                alert("Lütfen kullanıcı adlarını, cookies.txt dosyasını ve GitHub Token alanını eksiksiz doldurun!");
                return;
            }

            status.innerText = "⏳ Dosya okunuyor ve aktarılıyor...";
            status.style.color = "#ffaa00";

            try {
                const cookiesTxtContent = await readFile(fileInput1.files[0]);

                const userData = [
                    { myUser: user1, targetUser: target1, cookiesTxt: cookiesTxtContent }
                ];

                const payload = {
                    event_type: "update_secrets",
                    client_payload: { user_data: userData }
                };

                const response = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/dispatches`, {
                    method: "POST",
                    headers: {
                        "Accept": "application/vnd.github.v3+json",
                        "Authorization": `token ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if(response.ok || response.status === 204) {
                    status.innerText = "✅ Dosya başarıyla yüklendi! Bot otomatik çalıştırıldı.";
                    status.style.color = "#00ff88";
                } else {
                    status.innerText = "❌ Hata oluştu! GitHub Token'ınızı kontrol edin.";
                    status.style.color = "#ff4444";
                }
            } catch (err) {
                status.innerText = "❌ Dosya okunurken veya aktarılırken hata oluştu.";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
