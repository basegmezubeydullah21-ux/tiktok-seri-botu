<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Seri Botu</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #fe2c55; }
        label { font-size: 14px; color: #bbb; display: block; margin-top: 12px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        textarea { height: 100px; font-family: monospace; font-size: 12px; }
        button { width: 100%; padding: 12px; background: #fe2c55; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #e0264b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>TikTok Seri Botu 🚀</h2>
        
        <label>Senin Kullanıcı Adın:</label>
        <input type="text" id="user1" placeholder="ör: ahmet">
        
        <label>Arkadaşının Kullanıcı Adı:</label>
        <input type="text" id="target1" placeholder="ör: mehmet">
        
        <label>Senin Session ID Çerezin:</label>
        <input type="password" id="session1" placeholder="senin sessionid değerin">
        
        <hr style="border-color: #333; margin-top: 20px;">
        
        <label>Arkadaşının Kullanıcı Adı (İkinci hesap):</label>
        <input type="text" id="user2" placeholder="ör: mehmet">
        
        <label>Senin Kullanıcı Adın (Hedef):</label>
        <input type="text" id="target2" placeholder="ör: ahmet">
        
        <label>Arkadaşının Session ID Çerezi:</label>
        <input type="password" id="session2" placeholder="arkadaşının sessionid değeri">

        <button onclick="generateJSON()">Gizli Kodu Oluştur</button>

        <label style="margin-top: 20px;">Oluşan Kodu Kopyala ve GitHub'a Yapıştır:</label>
        <textarea id="output" readonly placeholder="Kod burada görünecek..."></textarea>
    </div>

    <script>
        function generateJSON() {
            const list = [
                {
                    myUser: document.getElementById('user1').value.trim(),
                    targetUser: document.getElementById('target1').value.trim(),
                    sessionId: document.getElementById('session1').value.trim()
                },
                {
                    myUser: document.getElementById('user2').value.trim(),
                    targetUser: document.getElementById('target2').value.trim(),
                    sessionId: document.getElementById('session2').value.trim()
                }
            ];

            document.getElementById('output').value = JSON.stringify(list, null, 2);
        }
    </script>
</body>
</html>
